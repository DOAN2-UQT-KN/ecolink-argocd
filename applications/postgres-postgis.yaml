apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-postgis
  namespace: argocd
spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: ecolink

  source:
    repoURL: https://github.com/DOAN2-UQT-KN/helm.git
    targetRevision: main
    path: charts/postgres-postgis

    helm:
      releaseName: postgres-postgis
      valuesObject:
        image:
          repository: postgis/postgis
          tag: "17-3.5"
        # Must match service charts' decoded DATABASE password (URL-encoded as hacktaonuadi%40)
        auth:
          password: "hacktaonuadi@"
        databases:
          - identitydb
          - incidentdb
          - rewarddb
          - notificationdb
          - aidb
          - monolith_db
        persistence:
          enabled: true
          size: 20Gi
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 250m
            memory: 1Gi
        service:
          type: ClusterIP
          port: 5432
        ingress:
          enabled: false
        # In-cluster only — SG does not expose 5433; services use postgres-postgis:5432
        tcpIngress:
          enabled: false

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
